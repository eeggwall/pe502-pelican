<style>

.mast{display:flex;gap:14px;align-items:center;padding:12px 15px}

nav.tabs{font-family:var(--mono);font-size:12px;padding:0;border-top:1px solid var(--dark);

<!-- ============ STATIC PAGES ============ -->

<template id="home-intro">
  <p>PE502 is a research site about <b>castles</b>: polyominoes made of columns standing side by side on a common base, with at least one column reaching a fixed ceiling. It takes its name from Project Euler problem 502, which asks how many castles on a large grid are built from an even number of blocks.</p>
  <p>Two kinds of things are posted here. <a href="#bulletins">Bulletins</a> are short, dated updates. <a href="#publications">Publications</a> are standalone documents with permanent numbers: PE502-1, PE502-2, and so on. Both are sorted by subject into <a href="#divisions">divisions</a>.</p>
</template>

<template id="about-page">
  <div class="win">
    <div class="bar">About</div>
    <div class="in">
      <p>PE502 is the research site of Charles Reid. It started with Project Euler problem 502 and kept going, because the counting problem turned out to touch generating functions, number fields, spectra, signals, and codes.</p>
      <p>A <b>castle</b> of width <i>w</i> and height <i>h</i> is a row of <i>w</i> columns standing on a common base, with column heights <i>c</i><sub>1</sub>, ..., <i>c</i><sub><i>w</i></sub> between 1 and <i>h</i> and at least one column reaching <i>h</i>. A <b>block</b> is a maximal horizontal run of filled cells in a single row, so the full bottom row is one block. The problem asks how many castles have an even number of blocks, on grids as large as 10<sup>12</sup> in one dimension. <a href="#PE502-1">PE502-1</a> is a self-contained introduction.</p>
    </div>
  </div>

  <div class="win">
    <div class="bar">What gets posted</div>
    <div class="in">
      <dl class="defs">
        <dt>Bulletins</dt>
        <dd>Short, dated updates: a new count, a conjecture checked to some size, a note on work in progress. Each is numbered within its source, as in "Enumeration Bulletin 3", or "Bulletin 12" for general updates. Bulletins are informal and are not part of the publication series.</dd>
        <dt>Publications</dt>
        <dd>Standalone documents with a permanent number: PE502-1, PE502-2, and so on. The number says nothing about topic or type. A publication is frozen when it is issued; a correction or revision gets a new number that names the publication it replaces, and both stay available.</dd>
        <dt>Divisions</dt>
        <dd>Subject headings for sorting bulletins and publications. A publication can be tagged with several divisions. Divisions never appear in a publication number.</dd>
      </dl>

    "Steganography on skylines: LSB payloads, block-parity carriers, and capacity per castle.",
    "The castle as a channel: real image rows read as carriers, and how they degrade under cropping, scaling, and re-encoding.",

    "Integrity without a key: a keyed fractional phase broken with three known castles; a public-order phase as an integrity check; the castle ring by invariant factors, with Pohlig-Hellman as the structure theorem.",

    "Constrained coding: run-length-limited sequences as castle towers, the Shannon capacity of a constraint, and line codes from recording and telephony.",

// Published reports. id through obsoleted_by mirror pe502-pubs/published.json;
// divisions, summary and abstract are site metadata.
var PUBLICATIONS = [
  {id:"PE502-1", number:1, series:"Technical Report",
   title:"Castle Polyominoes and How to Count Them",
   date:"September 27, 2026", published:"2026-10-01", pdf:"PE502-1.pdf",
   sha256:"cb8bb61202e95242a8966de3ec1381f8e0a8000349030bea3165b1e8e72d0db7",
   obsoletes:[], obsoleted_by:[],
   divisions:["e", "n"],
   summary:"A self-contained introduction: castles and their blocks, a one-line count of all castles, and the parity condition handled by weighting each castle with a sign.",
   abstract:"<p>A castle is a bargraph polyomino: a row of columns standing on a common base, one of which reaches a given ceiling. Project Euler Problem 502 asks how many castles on a <i>w</i> &times; <i>h</i> grid are built from an even number of blocks, for grids as large as 10<sup>12</sup> in one dimension. This report is a self-contained introduction. It defines castles and their blocks, counts all castles in one line, and then shows how the parity condition is handled by weighting each castle with a sign. The result is a closed form for the even-block count in terms of a signed tower count whose generating function is rational, which is what makes the trillion-scale evaluations cheap.</p>"},
  {id:"PE502-2", number:2, series:"Technical Report",
   title:"Fibonacci Castles",
   date:"October 1, 2026", published:"2026-10-04", pdf:"PE502-2.pdf",
   sha256:"e7f4431b832abb34c701346da2bd572a7c2df30ecefb66eda768bf967e973eea",
   obsoletes:[], obsoleted_by:[],
   divisions:["m", "e", "q"],
   summary:"Castles of exact height 2 with no two neighbouring columns at the ceiling number <i>F</i><sub><i>w</i>+2</sub> &minus; 1 at width <i>w</i>. Transfer matrices, Zeckendorf ranks, block parity, and ridge castles up the metallic ladder.",
   abstract:"<p>A Fibonacci castle is a castle of exact height 2 in which no two neighbouring columns both reach the ceiling. There are <i>F</i><sub><i>w</i>+2</sub> &minus; 1 of them at width <i>w</i>, where <i>F</i><sub><i>n</i></sub> is the <i>n</i>-th Fibonacci number, so their number grows like a constant times &phi;<sup><i>w</i></sup>, with &phi; the golden ratio. This report counts them with a transfer matrix, derives Fibonacci identities from them, and ranks them by the Zeckendorf representation of integers. Their even-block count, the quantity that Project Euler Problem 502 asks for, is half their number up to a parity term that takes only the values &minus;1, 0 and 1 and repeats with period 6. Ridge castles, in which neighbouring columns differ in height unless both reach the ceiling, grow like &phi;<sup><i>w</i></sup> at height 2 and like the metallic mean of order <i>h</i> &minus; 1 at height <i>h</i>. Two more families grow like &phi;<sup><i>n</i></sup> when castles are counted by area: all castles of exact height 2, and prime castles, which have no column of height 1.</p>"}
];

// Bulletins. div is the posting division's key, or null for a general bulletin.
// n is the bulletin's number within its source and is part of its address, so never renumber.
// tags lists other divisions whose pages should also show it.
var BULLETINS = [
  {div:null, n:1, date:"2026-10-05", tags:[],
   title:"pe502.com is up",
   body:"<p>This site collects bulletins and publications on castle polyominoes. The first two publications, <a href=\"#PE502-1\">PE502-1</a> and <a href=\"#PE502-2\">PE502-2</a>, are up now. Each <a href=\"#divisions\">division</a> has a page with its bulletins, the publications tagged with it, and a list of its research interests.</p>"},
  {div:"e", n:1, date:"2026-10-01", tags:[],
   title:"Even-block castles on a 13 &times; 10 grid",
   body:"<p>There are 3,729,050,610,636 castles on a 13 &times; 10 grid with an even number of blocks, about 2<sup>41.8</sup>. Listing them one at a time stops being an option long before the sizes Project Euler asks about, which reach 10<sup>12</sup> in one dimension.</p><p><a href=\"#PE502-1\">PE502-1</a> weights each castle by a sign instead, and reduces the even-block count to a signed tower count whose generating function is rational.</p>"},

   title:"Ridge castles climb the metallic ladder",
   body:"<p>In a ridge castle, neighbouring columns differ in height unless both reach the ceiling. At height 2 ridge castles grow like &phi;<sup><i>w</i></sup>, with &phi; the golden ratio. At height <i>h</i> they grow like &delta;<sub><i>h</i>&minus;1</sub><sup><i>w</i></sup>, where &delta;<sub><i>a</i></sub> = (<i>a</i>&nbsp;+&nbsp;&radic;(<i>a</i><sup>2</sup>&nbsp;+&nbsp;4))/2 is the metallic mean of order <i>a</i>: golden at height 2, silver (1 + &radic;2) at height 3, bronze ((3&nbsp;+&nbsp;&radic;13)/2) at height 4.</p><p>Section 6 of <a href=\"#PE502-2\">PE502-2</a> has the transfer matrix and the counts.</p>"}
];

// ============ RENDERING ============
(function(){
  var main = document.getElementById("main");
  var tabs = Array.prototype.slice.call(document.querySelectorAll(".page > .win nav.tabs a"));

  function division(key){
    for(var i = 0; i < DIVISIONS.length; i++){ if(DIVISIONS[i].key === key){ return DIVISIONS[i]; } }
    return null;
  }
  function publication(id){
    for(var i = 0; i < PUBLICATIONS.length; i++){ if(PUBLICATIONS[i].id.toUpperCase() === id.toUpperCase()){ return PUBLICATIONS[i]; } }
    return null;
  }
  function bulletinId(b){ return b.div ? b.div + "-" + b.n : String(b.n); }
  function bulletinLabel(b){ var d = division(b.div); return (d ? d.name + " " : "") + "Bulletin " + b.n; }
  function bulletinTags(b){
    var out = b.div ? [b.div] : [];
    (b.tags || []).forEach(function(k){ if(out.indexOf(k) < 0){ out.push(k); } });
    return out;
  }
  function plural(n, word){ return n + " " + word + (n === 1 ? "" : "s"); }

  // Every bulletin and publication as one dated list, newest first.
  function entries(){
    var out = [];
    PUBLICATIONS.forEach(function(p){ out.push({kind:"pub", date:p.published, tags:p.divisions, item:p}); });
    BULLETINS.forEach(function(b){ out.push({kind:"bulletin", date:b.date, tags:bulletinTags(b), item:b}); });
    return out.sort(function(a, b){ return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
  }
  function taggedWith(key){ return entries().filter(function(e){ return e.tags.indexOf(key) >= 0; }); }
  function ofKind(list, kind){ return list.filter(function(e){ return e.kind === kind; }); }

  function win(bar, inner){
    return '<div class="win"><div class="bar">' + bar + '</div><div class="in">' + inner + '</div></div>';
  }
  function chips(keys){
    return '<span class="chips">' + keys.map(function(k){
      var d = division(k);
      return d ? '<a class="chip" href="#divisions/' + d.key + '" title="' + d.name + '">' + d.badge + '</a>' : "";
    }).join("") + '</span>';
  }
  function pdfLink(p){ return '<a class="ft" href="' + PDF_BASE + p.pdf + '">PDF</a>'; }
  function pubLink(id){ return '<a href="#' + id + '">' + id + '</a>'; }

  // A bulletin prints on a tractor-feed sheet; linked is false on its own page.
  function printout(b, linked){
    var title = linked ? '<a href="#bulletins/' + bulletinId(b) + '">' + b.title + '</a>' : b.title;
    var filed = bulletinTags(b).map(function(k){
      var d = division(k);
      return '<a href="#divisions/' + d.key + '">' + d.name + '</a>';
    }).join(", ");
    return '<article class="printout"><div class="sheet">' +
      '<div class="hd">' + bulletinLabel(b) + ' &nbsp;/&nbsp; ' + b.date + '</div>' +
      '<h3>' + title + '</h3>' + b.body +
      (filed ? '<p class="sig">Filed under ' + filed + '</p>' : '') +
      '</div></article>';
  }

  function renderEntry(e){
    if(e.kind === "bulletin"){ return printout(e.item, true); }
    var p = e.item;
    return '<article class="entry"><div class="meta"><span>' + p.published + '</span>' +
      '<span>' + p.id + ' &middot; ' + p.series + '</span>' + chips(e.tags) + '</div>' +
      '<h3><a href="#' + p.id + '">' + p.title + '</a> ' + pdfLink(p) + '</h3>' +
      '<div class="body"><p>' + p.summary + '</p></div></article>';
  }
  function feed(list, empty){
    return list.length ? '<div class="feed">' + list.map(renderEntry).join("") + '</div>' : '<p class="note">' + empty + '</p>';
  }

  // ---- pages ----

  function homePage(){
    return win("This site", document.getElementById("home-intro").innerHTML) +
      win("Latest", feed(entries().slice(0, 6), "Nothing posted yet.") +
        '<p class="note more"><a href="#bulletins">all bulletins</a> &nbsp;/&nbsp; <a href="#publications">all publications</a> &nbsp;/&nbsp; <a href="#divisions">divisions</a></p>');
  }

  function bulletinsPage(){
    return win("Bulletins", feed(ofKind(entries(), "bulletin"), "No bulletins yet.") +
      '<p class="note more">Bulletins are short, dated updates, numbered within each division. Each division page also lists the publications tagged with it.</p>');
  }

  function bulletinPage(b){
    var d = division(b.div);
    var back = d ? '<a href="#divisions/' + d.key + '">' + d.name + ' division</a> &nbsp;/&nbsp; ' : "";
    return win(bulletinLabel(b), printout(b, false) +
      '<p class="note more">' + back + '<a href="#bulletins">all bulletins</a></p>');
  }

  function publicationsPage(){
    var rows = PUBLICATIONS.slice().sort(function(a, b){ return b.number - a.number; }).map(function(p){
      return '<tr><td class="id">' + pubLink(p.id) + '</td>' +
        '<td class="ti"><a href="#' + p.id + '">' + p.title + '</a> ' + pdfLink(p) + '</td>' +
        '<td class="ty">' + p.series + '</td><td>' + chips(p.divisions) + '</td>' +
        '<td class="up">' + p.published + '</td></tr>';
    }).join("");
    return win("Publications",
      '<div class="scroll"><table><thead><tr><th>ID</th><th>TITLE</th><th>TYPE</th><th>DIVISIONS</th><th>PUBLISHED</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table></div>' +
      '<p class="note more">A publication is frozen when it is issued. A correction or revision gets a new number that names the publication it replaces, and both stay available.</p>');
  }

  function publicationPage(p){
    function list(ids){ return ids.map(pubLink).join(", "); }
    var defs = [
      ["Number", p.id],
      ["Type", p.series],
      ["Dated", p.date],
      ["Published", p.published],
      ["Divisions", chips(p.divisions)],
      ["PDF", '<a href="' + PDF_BASE + p.pdf + '">' + p.pdf + '</a>'],
      ["SHA-256", '<span class="hash">' + p.sha256 + '</span>']
    ];
    if(p.obsoletes.length){ defs.push(["Replaces", list(p.obsoletes)]); }
    if(p.obsoleted_by.length){ defs.push(["Replaced by", list(p.obsoleted_by)]); }
    return win(p.id + " &middot; " + p.series,
        '<h2>' + p.title + '</h2>' +
        '<dl class="defs">' + defs.map(function(d){ return '<dt>' + d[0] + '</dt><dd>' + d[1] + '</dd>'; }).join("") + '</dl>') +
      win("Abstract", p.abstract + '<p class="note more"><a href="#publications">all publications</a></p>');
  }

  function divisionsPage(){
    var cards = DIVISIONS.map(function(d){
      var list = taggedWith(d.key);
      var nb = ofKind(list, "bulletin").length, np = ofKind(list, "pub").length;
      var ct = [nb ? plural(nb, "bulletin") : "", np ? plural(np, "publication") : ""].filter(Boolean).join(" &middot; ") || "nothing posted yet";
      return '<a class="card" href="#divisions/' + d.key + '">' +
        '<span class="top"><span class="badge">' + d.badge + '</span><span class="nm">' + d.name + '</span></span>' +
        '<span class="bl">' + d.blurb + '</span><span class="ct">' + ct + '</span></a>';
    }).join("");
    return win("Divisions",
      '<p>Divisions sort bulletins and publications by subject. Each has a page with its own bulletins, the publications tagged with it, and a list of its research interests.</p>' +
      '<div class="cards">' + cards + '</div>');
  }

  function divisionPage(d, sub){
    var list = taggedWith(d.key);
    var head = '<div class="win"><div class="mast"><div class="badge">' + d.badge + '</div><div>' +
      '<h2>' + d.name + '</h2><div class="sub">' + d.blurb + '</div></div></div>' +
      '<nav class="tabs" aria-label="' + d.name + ' division">' +
      '<a href="#divisions/' + d.key + '"' + (sub ? '' : ' aria-current="page"') + '>bulletins and publications (' + list.length + ')</a>' +
      '<a href="#divisions/' + d.key + '/interests"' + (sub ? ' aria-current="page"' : '') + '>research interests</a>' +
      '<a class="back" href="#divisions">all divisions</a></nav></div>';
    if(sub){
      return head + win("Research interests",
        '<ul class="topics">' + d.topics.map(function(t){ return '<li>' + t + '</li>'; }).join("") + '</ul>');
    }
    return head + win("Bulletins and publications",
      feed(list, "Nothing posted yet. The <a href=\"#divisions/" + d.key + "/interests\">research interests</a> list what this division covers."));
  }

  function aboutPage(){ return document.getElementById("about-page").innerHTML; }

  function notFound(){
    return win("Not found", '<p>Nothing at this address. <a href="#home">Back to the start.</a></p>');
  }

  // ---- routing ----

  function resolve(hash){
    var parts = hash.split("/"), top = parts[0] || "home";
    var d, p, b;
    if(top === "home" && parts.length === 1){ return {tab:"home", title:"", html:homePage()}; }
    if(top === "about" && parts.length === 1){ return {tab:"about", title:"About", html:aboutPage()}; }
    if(top === "publications" && parts.length === 1){ return {tab:"publications", title:"Publications", html:publicationsPage()}; }
    if(top === "bulletins"){
      if(parts.length === 1){ return {tab:"bulletins", title:"Bulletins", html:bulletinsPage()}; }
      for(var i = 0; i < BULLETINS.length; i++){ if(bulletinId(BULLETINS[i]) === parts[1]){ b = BULLETINS[i]; } }
      if(b && parts.length === 2){ return {tab:"bulletins", title:bulletinLabel(b), html:bulletinPage(b)}; }
    }
    if(top === "divisions"){
      if(parts.length === 1){ return {tab:"divisions", title:"Divisions", html:divisionsPage()}; }
      d = division(parts[1]);
      if(d && parts.length === 2){ return {tab:"divisions", title:d.name, html:divisionPage(d, false)}; }
      if(d && parts.length === 3 && parts[2] === "interests"){ return {tab:"divisions", title:d.name + " research interests", html:divisionPage(d, true)}; }
    }
    if(parts.length === 1 && (p = publication(top))){ return {tab:"publications", title:p.id, html:publicationPage(p)}; }
    return {tab:null, title:"Not found", html:notFound()};
  }

  function show(moveFocus){
    var r = resolve(decodeURIComponent((location.hash || "").replace(/^#/, "")));
    main.innerHTML = r.html;
    document.title = r.title ? r.title.replace(/&[a-z]+;/g, "-") + " - PE502" : "PE502";
    tabs.forEach(function(t){
      if(t.getAttribute("data-tab") === r.tab){ t.setAttribute("aria-current", "page"); }
      else { t.removeAttribute("aria-current"); }
    });
    window.scrollTo(0, 0);
    if(moveFocus){ main.focus({preventScroll:true}); }
  }

  // The skip link moves focus without changing the address.
  document.querySelector("a.skip").addEventListener("click", function(e){
    e.preventDefault();
    main.focus();
  });

  window.addEventListener("hashchange", function(){ show(true); });
  show(false);
})();
</script>
